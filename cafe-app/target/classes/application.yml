spring:
  datasource:
    url: jdbc:postgresql://db:5432/cafe_db
    username: cafe_user
    password: cafe_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  thymeleaf:
    cache: false
server:
  port: 8080
logging:
  level:
    root: INFO
    com.example.cafe: DEBUG
app:
  loyalty:
    points-per-order: 10
